name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: Verification gate
        env:
          VERIFI_ALLOW_PROTECTED: ${{ contains(github.event.pull_request.labels.*.name, 'human:approved') && '1' || '0' }}
        run: python scripts/verify.py --ci --label ci --docker auto

      - name: Job summary
        if: always()
        run: |
          if [ -f .verification/latest ]; then
            cat ".verification/$(cat .verification/latest)/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          path: .verification/
          retention-days: 30
          include-hidden-files: true
